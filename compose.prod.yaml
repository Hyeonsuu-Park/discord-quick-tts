# 이 PC 를 배포 서버로 쓸 때 compose.yaml 위에 덮어쓰는 설정 (ADR 0068).
#
#   docker compose -f compose.yaml -f compose.prod.yaml --profile app --profile tunnel up -d
#
# compose.yaml 은 개발용 그대로 두고, 여기서는 운영에 필요한 것만 바꾼다.
# - 프로젝트 이름이 quicktts-prod 라서 개발용 MySQL(bootRun 의 QUICKTTS_DEV_MYSQL)과 컨테이너, 데이터가 섞이지 않는다.
# - 이미지는 이 PC 에서 만들지 않고 CI 가 ghcr.io 에 올린 것을 받는다. 무엇이 떠 있는지 태그로 안다.
# - 비밀번호는 .env 에서 받는다. 비어 있으면 띄우지 않는다.
# - MySQL, synthesis 서비스 포트는 열지 않는다. 봇 서버는 이 PC 안(127.0.0.1)에서만 열고, 바깥은 cloudflared 로만 붙는다.
# - 컨테이너가 죽거나 PC 를 다시 켜면 저절로 다시 뜬다(Docker Desktop 이 로그인할 때 켜져 있어야 한다).
# - 컨테이너 로그는 서비스마다 10MB 파일 3개까지만 남긴다.
# - 추적 화면(otel-lgtm)은 띄우지 않는다.
# - DB 를 하루에 한 번 QUICKTTS_BACKUP_DIR(기본 ./backups)에 덤프하고 14일치를 남긴다(ADR 0073).
#   이 폴더를 OneDrive·Google Drive 처럼 다른 곳에 올라가는 폴더로 두면 PC 가 망가져도 남는다.
#
# .env 에 넣을 값은 .env.example 의 "배포" 부분에 있다.

name: quicktts-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_PASSWORD: ${QUICKTTS_PROD_DB_PASSWORD:?.env 에 QUICKTTS_PROD_DB_PASSWORD 를 넣으세요}
      MYSQL_ROOT_PASSWORD: ${QUICKTTS_PROD_DB_ROOT_PASSWORD:?.env 에 QUICKTTS_PROD_DB_ROOT_PASSWORD 를 넣으세요}
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uquicktts -p\"$$MYSQL_PASSWORD\""]

  # 띄우자마자 한 번, 그 뒤 24시간마다 덤프한다. 다 쓴 파일만 .sql.gz 이름을 얻으므로 덜 쓴 파일로 되살리는 일이 없다.
  # 되살리기와 연습은 docs/runbook.md 와 scripts/restore-drill.sh.
  mysql-backup:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${QUICKTTS_PROD_DB_PASSWORD:?.env 에 QUICKTTS_PROD_DB_PASSWORD 를 넣으세요}
      KEEP_DAYS: ${QUICKTTS_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${QUICKTTS_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        while true; do
          file=/backups/quicktts-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          mysqldump -h mysql -u quicktts --single-transaction --no-tablespaces quicktts | gzip > "$$file.part"
          mv "$$file.part" "$$file"
          find /backups -name 'quicktts-*.sql.gz' -mtime +"$$KEEP_DAYS" -delete
          echo "DB 를 $$file 에 덤프했습니다."
          sleep 86400
        done

  synthesis-service:
    build: !reset null
    image: ghcr.io/hyeonsuu-park/quicktts-synthesis-service:${QUICKTTS_IMAGE_TAG:?.env 에 QUICKTTS_IMAGE_TAG 를 넣으세요 (예 main-b8cc839)}
    restart: unless-stopped
    logging: *logging
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !reset null
    ports: !reset []
    healthcheck:
      # 이미지에 curl 이 없어서 bash 로 상태 확인 주소를 부른다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  bot-server:
    build: !reset null
    image: ghcr.io/hyeonsuu-park/quicktts-bot-server:${QUICKTTS_IMAGE_TAG:?.env 에 QUICKTTS_IMAGE_TAG 를 넣으세요 (예 main-b8cc839)}
    restart: unless-stopped
    logging: *logging
    environment:
      QUICKTTS_DB_PASSWORD: ${QUICKTTS_PROD_DB_PASSWORD:?.env 에 QUICKTTS_PROD_DB_PASSWORD 를 넣으세요}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !reset null
    # 이 PC 의 데스크톱 앱은 http://localhost:8080 으로 붙는다. 같은 와이파이의 다른 기기는 닿지 않는다.
    ports: !override
      - "127.0.0.1:${QUICKTTS_HOST_PORT:-8080}:8080"
    depends_on:
      synthesis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 3s
      retries: 3
      # 디스코드 샤드가 모두 붙고 DB 마이그레이션이 끝날 때까지 기다린다(쿠버네티스 startupProbe 와 같은 2분 30초).
      start_period: 150s

  otel-lgtm:
    profiles: !override [observability]

  cloudflared:
    restart: unless-stopped
    logging: *logging
    depends_on: !override
      bot-server:
        condition: service_healthy
