spring:
  application:
    name: quick-tts-synthesis
  cache:
    # 같은 목소리, 같은 문장의 음성을 기억해 비공식 TTS 를 덜 부른다. 봇 서버와 같은 크기이고 벌마다 따로 기억한다.
    cache-names: speech
    caffeine:
      spec: maximumSize=500,expireAfterAccess=1d,recordStats

server:
  port: ${SYNTHESIS_PORT:8080}

management:
  server:
    # 쿠버네티스에서는 관리 포트를 따로 연다(MANAGEMENT_SERVER_PORT=8081). 정하지 않으면 8080 하나다.
    port: ${MANAGEMENT_SERVER_PORT:}
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # 응답 시간 95% 값을 Prometheus 에서 계산할 수 있게 구간별 개수를 낸다.
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        # 지표는 Prometheus 가 긁어 간다(ADR 0057). 추적용 OpenTelemetry 가 함께 들여오는 OTLP 지표 내보내기는 끈다.
        enabled: false
  tracing:
    sampling:
      # 요청이 적어 모두 남긴다. 많아지면 낮춘다(예: 0.1). 추적은 OTEL_EXPORTER_OTLP_TRACES_ENDPOINT 를 줄 때만 내보낸다 (ADR 0063).
      probability: ${QUICKTTS_TRACING_SAMPLING:1.0}

quicktts:
  tts:
    # 봇 서버의 같은 설정과 값을 맞춘다. 봇 서버가 이 서비스를 부르면 기본 목소리는 이 값을 쓴다.
    default-voice: ${QUICKTTS_DEFAULT_VOICE:edge:ko-KR-SunHiNeural}
    edge-chromium-version: 143.0.3650.75
