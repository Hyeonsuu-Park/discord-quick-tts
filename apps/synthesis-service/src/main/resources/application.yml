spring:
  application:
    name: quick-tts-synthesis
  config:
    # 개발할 때는 저장소 루트의 .env 를 봇 서버와 함께 읽는다(QUICKTTS_DEFAULT_VOICE 등). 컨테이너에서는 환경변수만 쓴다.
    import: optional:file:.env[.properties]
  cache:
    # 같은 목소리, 같은 문장의 음성을 기억해 비공식 TTS 를 덜 부른다. mp3 한 개가 20KB 안팎이라 500개면 10MB 정도다.
    # 벌마다 따로 기억한다. 실패한 결과는 기억하지 않는다. 적중률은 /actuator/metrics/cache.gets 로 본다.
    cache-names: speech
    caffeine:
      spec: maximumSize=500,expireAfterAccess=1d,recordStats

server:
  # 컨테이너에서는 8080. 개발 PC 에서 bootRun 하면 봇 서버와 겹치지 않게 8082 로 뜬다(build.gradle.kts).
  port: ${SYNTHESIS_PORT:8080}

management:
  server:
    # 쿠버네티스에서는 관리 포트를 따로 연다(MANAGEMENT_SERVER_PORT=8081). 정하지 않으면 8080 하나다.
    port: ${MANAGEMENT_SERVER_PORT:}
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # 응답 시간 95% 값을 Prometheus 에서 계산할 수 있게 구간별 개수를 낸다.
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        # 지표는 Prometheus 가 긁어 간다(ADR 0057). 추적용 OpenTelemetry 가 함께 들여오는 OTLP 지표 내보내기는 끈다.
        enabled: false
  tracing:
    sampling:
      # 요청이 적어 모두 남긴다. 많아지면 낮춘다(예: 0.1). 추적은 OTEL_EXPORTER_OTLP_TRACES_ENDPOINT 를 줄 때만 내보낸다 (ADR 0063).
      probability: ${QUICKTTS_TRACING_SAMPLING:1.0}

quicktts:
  tts:
    # 목소리를 고르지 않은 사용자에게 쓰는 목소리. 사람마다 디스코드 /목소리 명령으로 바꿀 수 있다.
    # 고를 수 있는 값: edge:ko-KR-SunHiNeural, edge:ko-KR-InJoonNeural, edge:ko-KR-HyunsuMultilingualNeural, google:ko
    default-voice: ${QUICKTTS_DEFAULT_VOICE:edge:ko-KR-SunHiNeural}
    # Edge 목소리 서버가 확인하는 Edge 브라우저 버전. Edge 목소리가 갑자기 안 되면 최신 버전으로 올린다.
    edge-chromium-version: 143.0.3650.75
    # 엔진 하나가 음성을 다 보내기까지 기다리는 시간(연결 포함). Edge 가 실패하면 Google 로 한 번 더 만들므로
    # 서비스 한 번은 둘을 더한 7초 안에 끝난다. 봇 서버(8초), 데스크톱 앱(10초)이 이보다 길어야 한다 (ADR 0070).
    edge-timeout: 4s
    google-timeout: 3s
