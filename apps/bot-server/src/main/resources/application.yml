spring:
  application:
    name: quick-tts-bot
  config:
    # 개발할 때는 저장소 루트의 .env(KEY=VALUE)를 읽는다. 없으면(컨테이너) 환경변수만 쓴다.
    import: optional:file:.env[.properties]
  docker:
    compose:
      # 개발 PC 에서 bootRun 할 때 compose.yaml 의 MySQL 을 쓰려면 .env 에 QUICKTTS_DEV_MYSQL=true. 켜면 아래 datasource 대신 그 MySQL 에 붙는다.
      enabled: ${QUICKTTS_DEV_MYSQL:false}
  datasource:
    # 등록된 기기, 목소리 설정. 기본은 실행 위치의 data/ 폴더에 H2 파일로 저장한다(개발 PC).
    # 배포 서버는 MySQL 을 쓴다. 예: QUICKTTS_DB_URL=jdbc:mysql://localhost:3306/quicktts?connectionTimeZone=UTC
    # H2 는 MySQL 과 같은 SQL 이 돌도록 MySQL 호환 모드로 연다.
    url: ${QUICKTTS_DB_URL:jdbc:h2:file:./data/quicktts;MODE=MySQL}
    username: ${QUICKTTS_DB_USERNAME:sa}
    password: ${QUICKTTS_DB_PASSWORD:}
  flyway:
    # Flyway 전에 schema.sql 로 만든 DB 는 테이블이 이미 있으므로, 처음 한 번 V1 을 건너뛰고 그 위부터 쌓는다.
    baseline-on-migrate: true
  http:
    serviceclient:
      # 음성을 만드는 synthesis 서비스의 주소와 시간 제한 (ADR 0065).
      # 기본값은 개발 PC 에서 bootRun 으로 함께 띄운 synthesis 서비스(8082)다. compose 와 쿠버네티스는 QUICKTTS_SYNTHESIS_URL 로 바꾼다.
      # 엔진이 실패하면 서비스 안에서 다른 엔진으로 한 번 더 만들기 때문에 읽기 시간 제한을 넉넉히 둔다.
      synthesis:
        base-url: ${QUICKTTS_SYNTHESIS_URL:http://localhost:8082}
        connect-timeout: 2s
        read-timeout: 45s
  jpa:
    # 스키마는 Flyway 가 만들고, JPA 는 엔티티가 테이블과 맞는지만 켜질 때 확인한다.
    hibernate:
      ddl-auto: validate
    # 웹 요청이 끝날 때까지 DB 연결을 붙잡지 않는다. 지연 로딩할 연관 관계가 없다.
    open-in-view: false
    properties:
      # Instant 를 시간대 없는 datetime(6) 열에 JdbcClient 때와 같은 방식으로 넣고 읽는다.
      # 기본값(시간대 있는 timestamp)이면 H2 에서 열 타입이 맞지 않는다.
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP

server:
  port: ${QUICKTTS_PORT:8080}

management:
  server:
    # 쿠버네티스에서는 관리 포트를 따로 연다(예: MANAGEMENT_SERVER_PORT=8081). 그 포트는 클러스터 안에서만 닿으므로
    # 프로브와 Prometheus 가 토큰 없이 부른다. 정하지 않으면(개발, compose) 8080 하나다 (ADR 0057).
    port: ${MANAGEMENT_SERVER_PORT:}
  endpoints:
    web:
      exposure:
        # 상태 확인(health)은 토큰 없이, 지표(metrics, prometheus)는 기기 토큰이 있어야 본다. 관리 포트를 따로 열면 거기서는 토큰 없이 본다.
        include: health, metrics, prometheus
  endpoint:
    health:
      # /actuator/health/liveness 는 프로세스가 살아 있는지만, /actuator/health/readiness 는 DB 와 디스코드 샤드까지 본다.
      # 디스코드가 잠깐 끊겨 JDA 가 다시 붙는 동안 liveness 가 DOWN 이면 쿠버네티스가 파드를 죽여 오히려 늦게 붙는다.
      # /actuator/health 는 지금처럼 모두 본다(데스크톱 앱이 서버가 떠 있는지 보는 주소).
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db, discord
  otlp:
    metrics:
      export:
        # 지표는 Prometheus 가 긁어 간다(ADR 0057). 추적용 OpenTelemetry 가 함께 들여오는 OTLP 지표 내보내기는 끈다.
        enabled: false
  tracing:
    sampling:
      # 요청이 적어 모두 남긴다. 많아지면 낮춘다(예: 0.1). 추적은 OTEL_EXPORTER_OTLP_TRACES_ENDPOINT 를 줄 때만 내보낸다 (ADR 0063).
      probability: ${QUICKTTS_TRACING_SAMPLING:1.0}
  metrics:
    distribution:
      # "빠름" 지표는 그래프 화면 없이 /actuator/metrics 에서도 보이게 중간값과 95% 값을 서버에서 계산해 둔다 (ADR 0053).
      percentiles:
        quicktts.quickchat.speak: 0.5, 0.95
        quicktts.speech.queue.wait: 0.5, 0.95

springdoc:
  # 웹 API 문서. /v3/api-docs 가 OpenAPI JSON, /swagger-ui.html 이 화면이다. 토큰 없이 열린다(ADR 0054).
  # 공개 서버에서 문서를 숨기려면 QUICKTTS_API_DOCS_ENABLED=false 로 둔다.
  api-docs:
    enabled: ${QUICKTTS_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${QUICKTTS_API_DOCS_ENABLED:true}
  default-produces-media-type: application/json

quicktts:
  discord:
    token: ${DISCORD_TOKEN:}
  guild-allowlist:
    # 켜 두면 봇 주인이 /허용목록 으로 넣은 디스코드 서버에만 봇이 남고, 다른 곳에 초대되면 안내를 남기고 나간다.
    # 누구나 초대할 수 있게 공개할 때 false 로 바꾼다.
    enabled: ${QUICKTTS_GUILD_ALLOWLIST_ENABLED:true}
  rate-limit:
    # 웹 API 사용량 제한 (ADR 0069). 평소 쓰는 사람은 닿지 않는 값이다. 넘으면 429 와 Retry-After 로 답한다.
    # 기기 토큰이 있는 요청은 디스코드 사용자마다 1분에 몇 번까지
    requests-per-minute: ${QUICKTTS_RATE_LIMIT_REQUESTS_PER_MINUTE:60}
    # 기기 등록은 보낸 곳(IP)마다 1분에 몇 번까지
    registrations-per-minute: ${QUICKTTS_RATE_LIMIT_REGISTRATIONS_PER_MINUTE:10}
