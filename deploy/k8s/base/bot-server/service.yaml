apiVersion: v1
kind: Service
metadata:
  name: bot-server
  labels:
    app.kubernetes.io/name: bot-server
spec:
  selector:
    app.kubernetes.io/name: bot-server
  ports:
    # 데스크톱 앱이 부르는 웹 API.
    - name: http
      port: 8080
      targetPort: http
    # 프로브와 Prometheus. 클러스터 밖으로 내보내지 않는다.
    - name: management
      port: 8081
      targetPort: management
