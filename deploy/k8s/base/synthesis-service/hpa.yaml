# CPU 를 평균 70% 넘게 쓰면 늘리고, 덜 쓰면 줄인다. k3s/k3d 에는 CPU 를 재는 metrics-server 가 들어 있다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synthesis-service
  labels:
    app.kubernetes.io/name: synthesis-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synthesis-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
