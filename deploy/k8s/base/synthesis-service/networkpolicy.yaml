# 웹 API(8080)는 봇 서버만 부른다. 인증이 없는 내부 API 라 네트워크로 막는다 (ADR 0061).
# 관리 포트(8081)는 프로브와 Prometheus 가 부르므로 클러스터 안 어디서나 받는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synthesis-service
  labels:
    app.kubernetes.io/name: synthesis-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synthesis-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bot-server
      ports:
        - port: http
    - ports:
        - port: management
