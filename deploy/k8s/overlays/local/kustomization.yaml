# 현수 PC 의 k3d 클러스터 (ADR 0059).
#   1. secrets.env.example, mysql.env.example 을 .example 을 뗀 이름으로 복사해 값을 채운다 (커밋되지 않는다).
#      디스코드 토큰은 개발용 봇 것을 쓴다. 배포 봇이나 bootRun 과 같은 토큰으로 동시에 켜지 않는다.
#   2. kubectl apply -k deploy/k8s/overlays/local
#   3. kubectl -n quicktts port-forward svc/bot-server 8080:8080
#      데스크톱 앱 서버 주소는 http://localhost:8080 그대로 쓴다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# kube-prometheus-stack 을 설치했으면 주석을 푼다 (deploy/monitoring/README.md).
# components:
#   - ../../components/monitoring

# main 에 머지될 때마다 올라가는 이미지. 막 고친 코드를 올리려면
#   docker build -f apps/bot-server/Dockerfile -t ghcr.io/hyeonsuu-park/quicktts-bot-server:main .
#   k3d image import ghcr.io/hyeonsuu-park/quicktts-bot-server:main -c quicktts
# synthesis 서비스도 같은 방법이다(apps/synthesis-service/Dockerfile, quicktts-synthesis-service).
images:
  - name: ghcr.io/hyeonsuu-park/quicktts-bot-server
    newTag: main
  - name: ghcr.io/hyeonsuu-park/quicktts-synthesis-service
    newTag: main

secretGenerator:
  - name: bot-server-secrets
    envs:
      - secrets.env
  - name: mysql-secrets
    envs:
      - mysql.env

patches:
  # 이미지를 PC 에 직접 넣었을 때 그것을 쓴다. 같은 태그라도 레지스트리 것을 다시 받지 않는다.
  - target:
      kind: Deployment
      name: (bot-server|synthesis-service)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
