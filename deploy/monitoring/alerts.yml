# QuickTTS 알림 규칙 (ADR 0074). 이 PC 배포(compose.prod.yaml)의 Prometheus 가 읽는다.
# 쿠버네티스는 deploy/k8s/components/monitoring/prometheusrule.yaml 의 quicktts 묶음에 같은 규칙을 둔다.
# 둘이 같은지는 CI 의 매니페스트 검사가 본다. 알림을 받았을 때 할 일은 docs/runbook.md 의 "알림을 받았을 때".
groups:
  - name: quicktts
    rules:
      - alert: QuickTtsServiceDown
        expr: up{job=~"bot-server|synthesis-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 가 2분 넘게 지표에 답하지 않습니다."
          runbook: docs/runbook.md#서비스가-답하지-않음
      - alert: QuickTtsDiscordDisconnected
        expr: quicktts_discord_shards_connected < quicktts_discord_shards
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "디스코드 샤드 {{ $value }}개만 붙어 있습니다. 끊긴 샤드의 서버에서는 봇이 말하지 못합니다."
          runbook: docs/runbook.md#디스코드-연결이-끊김
      - alert: QuickTtsQuickChatFailing
        expr: sum by (error) (increase(quicktts_quickchat_speak_seconds_count{error=~"speech-synthesis-failed|unexpected-failure"}[10m])) >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "최근 10분 동안 quick chat 이 {{ $labels.error }} 로 {{ $value | printf \"%.0f\" }}번 실패했습니다."
          runbook: docs/runbook.md#quick-chat-이-실패함
      - alert: QuickTtsEngineCircuitOpen
        expr: max_over_time(resilience4j_circuitbreaker_state{state="closed"}[10m]) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TTS 엔진 {{ $labels.name }} 의 차단기가 10분 넘게 닫히지 않았습니다. 다른 엔진으로 대신 읽는 중입니다."
          runbook: docs/runbook.md#tts-엔진-차단기가-열림
