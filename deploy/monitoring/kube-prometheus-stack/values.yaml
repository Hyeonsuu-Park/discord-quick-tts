# kube-prometheus-stack(Prometheus, Grafana, 노드·쿠버네티스 지표) 설치 값 (ADR 0063).
# 노드 하나짜리 클러스터(현수 PC k3d, 작은 배포 서버)에 맞게 작게 둔다. 설치는 deploy/monitoring/README.md.

# 알림은 디스코드 채널 웹훅으로 보낸다 (ADR 0074). 규칙은 deploy/k8s/components/monitoring/prometheusrule.yaml.
# 웹훅 주소는 비밀값으로 따로 만든다(deploy/monitoring/README.md):
#   kubectl -n monitoring create secret generic alertmanager-discord --from-literal=url=<웹훅 주소>
alertmanager:
  enabled: true
  alertmanagerSpec:
    # 비밀값을 /etc/alertmanager/secrets/alertmanager-discord/ 아래 파일로 붙인다.
    secrets: [alertmanager-discord]
  config:
    route:
      receiver: discord
      group_by: [alertname, job]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # 차트가 늘 울리는 "살아 있음" 알림은 보내지 않는다.
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/url
            send_resolved: true

grafana:
  # 처음 로그인 비밀번호. 배포 서버에서는 --set grafana.adminPassword=... 로 바꿔 설치한다.
  adminPassword: quicktts-dev
  sidecar:
    dashboards:
      # 다른 네임스페이스(quicktts)의 grafana_dashboard 라벨 ConfigMap 도 대시보드로 올린다.
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    # 이 차트가 만든 것만이 아니라 클러스터의 모든 ServiceMonitor 를 본다(quicktts 의 봇 서버, synthesis 서비스).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # 이 차트가 만든 것만이 아니라 클러스터의 모든 PrometheusRule(quicktts 의 알림 규칙)을 읽는다.
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
