name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # 컴파일, 단위 테스트, ArchUnit 아키텍처 규칙까지 모두 돈다.
      - run: ./gradlew build

      - name: 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # main 에 들어온 커밋은 빌드·테스트와 매니페스트 검사가 통과해야 이미지를 올린다 (ADR 0072).
  images:
    name: 이미지
    if: github.event_name == 'push'
    needs: [build, k8s-manifests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    secrets: inherit

  commit-messages:
    name: 커밋 메시지 컨벤션
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR 에서는 PR 에 들어온 커밋, main 푸시에서는 이번에 새로 올라온 커밋만 검사한다.
      - name: 새 커밋 제목 검사
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            commits=$(git rev-list --no-merges "$PR_BASE..$PR_HEAD")
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --no-merges "$PUSH_BEFORE..$PUSH_AFTER")
          else
            # 이전 커밋을 알 수 없으면(첫 푸시, 강제 푸시) 맨 위 커밋만 본다.
            commits=$PUSH_AFTER
          fi
          failed=0
          for commit in $commits; do
            git log -1 --format=%s "$commit" > /tmp/msg
            scripts/check-commit-msg.sh /tmp/msg || failed=1
          done
          exit $failed

  # 나눠 준 옛 앱이 계속 돌도록, main 의 API 약속과 PR 의 API 약속을 비교해 깨지는 변경을 막는다 (ADR 0076).
  # 약속 파일(libs/api-contract/openapi.json)이 컨트롤러와 같은지는 빌드의 통합 테스트가 본다.
  api-compatibility:
    name: API 호환성 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 옛 앱을 깨는 변경이 있는지 보기
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRACT: libs/api-contract/openapi.json
          # 일부러 깨는 변경(옛 판 경로 내리기 등)은 이 파일에 한 줄씩 적어 넘긴다. 최소 앱 판을 먼저 올린 뒤에만 쓴다.
          ALLOWED: libs/api-contract/openapi-breaking-allowed.txt
        run: |
          if ! git cat-file -e "$PR_BASE:$CONTRACT" 2>/dev/null; then
            echo "main 에 아직 API 약속 파일이 없어 비교하지 않습니다."
            exit 0
          fi
          git show "$PR_BASE:$CONTRACT" > /tmp/base-openapi.json
          go install github.com/oasdiff/oasdiff@v1.38.0
          ignore=()
          if [ -f "$ALLOWED" ]; then
            ignore=(--err-ignore "$ALLOWED")
          fi
          "$(go env GOPATH)/bin/oasdiff" breaking /tmp/base-openapi.json "$CONTRACT" \
            --fail-on ERR --format githubactions "${ignore[@]}"
          "$(go env GOPATH)/bin/oasdiff" changelog /tmp/base-openapi.json "$CONTRACT"

  k8s-manifests:
    name: 쿠버네티스 매니페스트 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 오버레이마다 Kustomize 로 펼친 뒤, 쿠버네티스 스키마에 맞는지 본다. 클러스터는 필요 없다.
      # 비밀값 파일은 커밋되지 않으므로 예시 파일을 복사해 쓴다.
      - name: 오버레이 펼치고 스키마 검사
        run: |
          for example in deploy/k8s/overlays/*/*.env.example; do
            cp "$example" "${example%.example}"
          done
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" > /tmp/rendered.yaml
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary < /tmp/rendered.yaml
            echo "::endgroup::"
          done

      # 알림 규칙은 이 PC 배포(deploy/monitoring/alerts.yml)와 클러스터(PrometheusRule)가 같아야 한다 (ADR 0074).
      - name: 두 곳의 알림 규칙이 같은지 확인
        run: |
          python3 - <<'PY'
          import sys, yaml
          compose = yaml.safe_load(open('deploy/monitoring/alerts.yml'))['groups']
          cluster = yaml.safe_load(open('deploy/k8s/components/monitoring/prometheusrule.yaml'))['spec']['groups']
          shared = [group for group in cluster if group['name'] in {g['name'] for g in compose}]
          if shared != compose:
              sys.exit('deploy/monitoring/alerts.yml 과 prometheusrule.yaml 의 같은 이름 묶음이 다릅니다.')
          print('알림 규칙이 같습니다:', ', '.join(g['name'] for g in compose))
          PY

      # 모니터링 component 는 kube-prometheus-stack 이 있어야 켜므로 오버레이에 기본으로 없다. 따로 붙여 검사한다.
      # ServiceMonitor 같은 CRD 는 공개 CRD 스키마 모음으로 본다.
      - name: 모니터링 component 검사
        run: |
          mkdir -p deploy/k8s/ci-monitoring
          cat > deploy/k8s/ci-monitoring/kustomization.yaml <<'YAML'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../overlays/local
          components:
            - ../components/monitoring
          YAML
          kubectl kustomize deploy/k8s/ci-monitoring > /tmp/rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            < /tmp/rendered.yaml
